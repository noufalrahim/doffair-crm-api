<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #4CAF50; color: white; padding: 30px; text-align: center; border-radius: 10px 10px 0 0; }
        .content { background: #f9f9f9; padding: 30px; border-radius: 0 0 10px 10px; }
    </style>
</head>
<body>
    <div class="header"><h1>✅ Booking Confirmed by Vendor</h1></div>
    <div class="content">
        <p>Hello {{ user_name }},</p>
        <p>Good news! {{ vendor_name }} has confirmed your booking.</p>
        <p><strong>Booking ID:</strong> {{ booking_id }}<br>
        <strong>Service:</strong> {{ service_type }}<br>
        <strong>Date:</strong> {{ scheduled_at }}</p>
        <p>Your service is all set!</p>
    </div>
</body>
</html>
